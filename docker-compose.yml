# Optional. Local development uses npm scripts, not Docker.
# The API does not connect to Postgres or Redis at runtime.

services:
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mercuser
      POSTGRES_PASSWORD: mercu
      POSTGRES_DB: mercu_clone
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./api
    ports:
      - "3001:3001"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
    depends_on:
      - api

volumes:
  db_data:
